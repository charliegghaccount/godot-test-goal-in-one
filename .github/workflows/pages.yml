name: Build, test and deploy Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import
        run: godot --headless --editor --import --quit
      - name: Runtime checks
        run: |
          godot --headless --script res://tests/runtime.gd
          godot --headless --script res://tests/mechanics.gd
          godot --headless --script res://tests/import.gd
      - name: Export single-threaded WebGL2
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
